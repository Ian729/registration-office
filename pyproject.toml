[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "registration-office"
version = "0.1.0"
description = "Issue-driven project registration for Train Station"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
registration-office = "registration_office.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
